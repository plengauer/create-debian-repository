name: 'Create Debian Repository'
description: 'Create full debian repository metadata on disk, ready to be served'
inputs:
  github_token:
    default: ${{ github.token }}
  source:
    default: ${{ github.repository }}
  mode:
    default: write
  directory:
    default: .
  max_size:
    default: '900000000'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: mkdir -p pool/main
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      working-directory: ${{ inputs.directory }}/pool/main
      run: |
        cat <<< "${{ inputs.source }}" | tr ',' '\n' | tr ';' '\n' | tr ' ' '\n' | xargs -I '{}' gh api /repos/'{}'/releases --paginate | jq '.[] | .assets[] | select(.name | endswith(".deb")) | .url' -r | xargs -r wget --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/octet-stream' --tries inf --random-wait -nc 2> /dev/null
    - shell: bash
      env:
        MAX_SIZE: ${{ inputs.max_size }}
      working-directory: ${{ inputs.directory }}/pool/main
      run: |
        ls | sort -nr | xargs -r stat -c '%s %n' | awk -v max_size="$MAX_SIZE" '(total += $1) > max_size { print $2 }' | xargs -r rm
    - shell: bash
      working-directory: ${{ inputs.directory }}/pool/main
      run: |
        ls | while read -r file; do
          mv "$file" "$file"_"$(dpkg -I "$file" control | grep 'Architecture:' | cut -d : -f 2 | tr -d ' ')".deb
        done
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        { echo all; dpkg-architecture -L | grep -v -- -; } | while read -r arch; do
          mkdir -p dists/stable/main/binary-"$arch"
          # [ ${{ inputs.mode }} = append ] || rm -rf dists/stable/main/binary-"$arch"/Packages
          dpkg-scanpackages --multiversion --arch "$arch" pool/main >> dists/stable/main/binary-"$arch"/Packages
          if [ "$arch" != all ]; then
            awk -v RS="" -v FS="\n" -v ORS="\n\n" '
              {
                pkg = ""; ver = ""; parch = "";
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Package: /) pkg = substr($i, 10);
                  if ($i ~ /^Version: /) ver = substr($i, 10);
                  if ($i ~ /^Architecture: /) parch = substr($i, 15);
                }
                key = pkg SUBSEP ver;
                paragraph[NR] = $0;
                paragraph_arch[NR] = parch;
                paragraph_key[NR] = key;
                if (parch != "all") has_specific[key] = 1;
              }
              END {
                for (i = 1; i <= NR; i++) {
                  if (paragraph_arch[i] == "all" && has_specific[paragraph_key[i]]) continue;
                  print paragraph[i];
                }
              }
            ' dists/stable/main/binary-"$arch"/Packages > dists/stable/main/binary-"$arch"/Packages.dedup
            mv dists/stable/main/binary-"$arch"/Packages.dedup dists/stable/main/binary-"$arch"/Packages
          fi
          if [ "$(wc -c < dists/stable/main/binary-"$arch"/Packages)" = 0 ]; then rm -rf dists/stable/main/binary-"$arch"; fi
        done
    - shell: bash
      working-directory: ${{ inputs.directory }}/pool/main
      run: |
        ls | while read -r file; do
          mv "$file" "${file%%_*.deb}"
        done
    - shell: bash
      working-directory: ${{ inputs.directory }}/dists/stable/main
      run: |
        ls | cut -d - -f 2- | while read -r arch; do
          sed -i -E 's/^Filename: (.*)_.*\.deb$/Filename: \1/g' binary-"$arch"/Packages
        done
    - shell: bash
      working-directory: ${{ inputs.directory }}/dists/stable/main
      run: |
        ls | cut -d - -f 2- | while read -r arch; do
          gzip -9 < binary-"$arch"/Packages > binary-"$arch"/Packages.gz
        done
    - shell: bash
      working-directory: ${{ inputs.directory }}/dists/stable
      run: |
        {
          do_hash() {
              HASH_NAME=$1
              HASH_CMD=$2
              echo "${HASH_NAME}:"
              for f in $(find -type f); do
                  f=$(echo $f | cut -c3-) # remove ./ prefix
                  if [ "$f" = "Release" ]; then
                      continue
                  fi
                  echo " $(${HASH_CMD} ${f}  | cut -d" " -f1) $(wc -c $f)"
              done
          }
          cat << EOF
        Origin: GitHub ${{ github.repository_owner }}
        Label: ${{ github.repository_owner }}
        Suite: stable
        Codename: stable
        Version: 1.0
        Architectures: $(ls -d main/binary-* 2>/dev/null | sed 's|main/binary-||' | tr '\n' ' ' | sed 's/ $//')
        Components: main
        Description: A software repository hosting packages from github
        Date: $(date -Ru)
        EOF
          do_hash "MD5Sum" "md5sum"
          do_hash "SHA1" "sha1sum"
          do_hash "SHA256" "sha256sum"
        } > Release
